name: APP_Giropops

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: Giropops

    steps:
      - name: Baixar código (Checkout)
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Definir Tags (Metadados)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/giropops-html
          tags: |
            # Se for main, cria a tag 'latest'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Se for develop, cria a tag 'dev'
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

# Enviar imagem para o Registry
  push:
    runs-on: self-hosted
    environment: Giropops
    needs: build 

    steps:
      - name: Login no Registry Privado
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

# Deploymento no ambiente
  deployment:
    runs-on: self-hosted
    environment: Giropops
    needs: build-and-push 
    steps:
      - name: Deploy via Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Verify Deployment Health
        run: |
          # Determina a porta alvo: 8081 para produção e 8082 para staging
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TARGET_PORT=8081
          else
            TARGET_PORT=8082
          fi
          
          echo "🔍 Verificando saúde em http://189.89.157.212:$TARGET_PORT"
          
          MAX_RETRIES=12
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://189.89.157.212:$TARGET_PORT || echo "000")
            
            if [ "$STATUS" == "200" ]; then
              echo "Aplicação ON (HTTP $STATUS)!"
              exit 0
            fi
            
            echo "Aguardando... (Tentativa $((COUNT+1))/$MAX_RETRIES - Status: $STATUS)"
            sleep 10
            COUNT=$((COUNT+1))
          done
          
          echo "Erro: Aplicação OFF! (após 2 minutos)"
          exit 1
