name: APP_Giropops

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  # Primeiro Job
  build-and-push:
    runs-on: self-hosted
    environment: Giropops
    steps:
      - name: Baixar código (Checkout)
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Mantém a rede do host para evitar bloqueios de DNS/Cloudflare
          driver-opts: network=host

      - name: Definir Tags (Metadados)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/giropops-html
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Login no Registry Privado
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # Segundo Job
  deployment:
    runs-on: self-hosted
    environment: Giropops
    # Garante que este job só inicie se o 'build-and-push' terminar com sucesso
    needs: build-and-push 
    steps:
      - name: Deploy via Portainer Webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Verify Deployment Health
        run: |
          # Define a porta alvo: 8081 para produção (main) e 8082 para staging (dev)
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TARGET_PORT=8081
          else
            TARGET_PORT=8082
          fi
          
          echo "Verificando saúde em http://189.89.157.212:$TARGET_PORT"
          
          MAX_RETRIES=12
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://189.89.157.212:$TARGET_PORT || echo "000")
            
            if [ "$STATUS" == "200" ]; then
              echo "Aplicação ON! (HTTP $STATUS)!"
              exit 0
            fi
            
            echo "Aguardando inicialização... (Tentativa $((COUNT+1))/$MAX_RETRIES - Status: $STATUS)"
            sleep 10
            COUNT=$((COUNT+1))
          done
          
          echo "Erro: Aplicação OFF! (não respondeu após 2 minutos)"
          exit 1
